<script type="text/babel">
    // 1. مكون إضافة المهام (محدث)
    function AddTask({ onAdd }) {
        const [text, setText] = React.useState("");
        
        const handleAdd = () => {
            // هذا هو التحقق: تانشوفو واش النص ماشي خاوي (بعد مسح الفراغات)
            if (text.trim() !== "") {
                onAdd(text);
                setText(""); // مسح الحقل بعد الإضافة
            } else {
                alert("ماتقدريش تزيدي مهمة خاوية!");
            }
        };

        return (
            <div>
                <input 
                    value={text} 
                    onChange={(e) => setText(e.target.value)} 
                    placeholder="كتبي مهمة جديدة..." 
                />
                <button onClick={handleAdd}>إضافة</button>
            </div>
        );
    }

    // 2. مكون عرض المهمة (باقي المكونات كما هي)
    function TaskItem({ task, onDelete }) {
        return (
            <li className="task-item">
                {task.text}
                <button onClick={onDelete}>حذف</button>
            </li>
        );
    }

    // 3. المكون الرئيسي (القائد)
    function App() {
        const [tasks, setTasks] = React.useState([]);

        const addTask = (text) => {
            setTasks([...tasks, { id: Date.now(), text }]);
        };

        const deleteTask = (id) => {
            setTasks(tasks.filter(t => t.id !== id));
        };

        return (
            <div className="container">
                <h1>ParaMaster Pro</h1>
                <AddTask onAdd={addTask} />
                <ul>
                    {tasks.map(t => (
                        <TaskItem key={t.id} task={t} onDelete={() => deleteTask(t.id)} />
                    ))}
                </ul>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
