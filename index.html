<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ParaMaster Pro المطور</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; direction: rtl; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .task-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. مكون إضافة المهام
        function AddTask({ onAdd }) {
            const [text, setText] = React.useState("");
            return (
                <div>
                    <input value={text} onChange={(e) => setText(e.target.value)} />
                    <button onClick={() => { onAdd(text); setText(""); }}>إضافة</button>
                </div>
            );
        }

        // 2. مكون عرض المهمة الواحدة
        function TaskItem({ task, onDelete }) {
            return (
                <li className="task-item">
                    {task.text}
                    <button onClick={onDelete}>حذف</button>
                </li>
            );
        }

        // 3. المكون الرئيسي (القائد)
        function App() {
            const [tasks, setTasks] = React.useState([]);

            const addTask = (text) => {
                if(text) setTasks([...tasks, { id: Date.now(), text }]);
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            return (
                <div className="container">
                    <h1>ParaMaster Pro</h1>
                    <AddTask onAdd={addTask} />
                    <ul>
                        {tasks.map(t => (
                            <TaskItem key={t.id} task={t} onDelete={() => deleteTask(t.id)} />
                        ))}
                    </ul>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
