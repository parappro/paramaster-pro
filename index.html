<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ParaMaster Pro</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f4f7f6; direction: rtl; display: flex; height: 100vh; }
        .sidebar { width: 200px; background: #2c3e50; color: white; padding: 20px; }
        .main { flex: 1; padding: 20px; }
        .menu-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #34495e; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('list');

            return (
                <div style={{display: 'flex', width: '100%'}}>
                    <div className="sidebar">
                        <h2>PARA MASTER</h2>
                        <div className="menu-item" onClick={() => setView('add')}>➕ إضافة</div>
                        <div className="menu-item" onClick={() => setView('list')}>📋 قائمة</div>
                    </div>
                    <div className="main">
                        <div className="card">
                            {view === 'add' ? <h1>صفحة الإضافة</h1> : <h1>قائمة المهام</h1>}
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
