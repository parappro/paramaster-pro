<script type="text/babel">
    function TodoApp() {
        const [tasks, setTasks] = React.useState(() => JSON.parse(localStorage.getItem('tasks')) || []);
        const [input, setInput] = React.useState("");

        React.useEffect(() => {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }, [tasks]);

        const addTask = () => {
            if (input.trim() !== "") {
                setTasks([...tasks, { text: input, completed: false }]);
                setInput("");
            }
        };

        const toggleTask = (index) => {
            const newTasks = [...tasks];
            newTasks[index].completed = !newTasks[index].completed;
            setTasks(newTasks);
        };

        const deleteTask = (index) => {
            setTasks(tasks.filter((_, i) => i !== index));
        };

        return (
            <div className="container">
                <h1>قائمة مهامي</h1>
                <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="مهمة جديدة..." />
                <button onClick={addTask}>إضافة</button>
                <ul>
                    {tasks.map((task, index) => (
                        <li key={index} style={{ textDecoration: task.completed ? 'line-through' : 'none', opacity: task.completed ? 0.6 : 1 }}>
                            <span onClick={() => toggleTask(index)} style={{ cursor: 'pointer' }}>{task.text}</span>
                            <button onClick={() => deleteTask(index)} style={{background: '#dc3545'}}>حذف</button>
                        </li>
                    ))}
                </ul>
            </div>
        );
    }
    // ... (باقي الكود هو نفسه)
</script>
