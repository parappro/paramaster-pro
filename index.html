<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ParaMaster Pro</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [message, setMessage] = React.useState("مرحباً بك في تطبيق ParaMaster Pro");

            return (
                <div style={{ textAlign: 'center', marginTop: '50px', fontFamily: 'Arial' }}>
                    <h1>{message}</h1>
                    <button 
                        onClick={() => setMessage("تم الضغط بنجاح! React يعمل!")}
                        style={{ padding: '15px 30px', fontSize: '18px', cursor: 'pointer', borderRadius: '10px' }}
                    >
                        اضغطي هنا
                    </button>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
