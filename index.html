<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ParaMaster Pro المطور</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; direction: rtl; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .task-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; }
        input { padding: 10px; width: 60%; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 8px 15px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; margin-right: 5px; }
        .del-btn { background: #dc3545; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // مكون إضافة المهام
        function AddTask({ onAdd }) {
            const [text, setText] = React.useState("");
            const handleAdd = () => {
                if (text.trim() !== "") {
                    onAdd(text);
                    setText("");
                } else {
                    alert("لا يمكن إضافة مهمة فارغة!");
                }
            };
            return (
                <div style={{ marginBottom: '20px' }}>
                    <input value={text} onChange={(e) => setText(e.target.value)} placeholder="مهمة جديدة..." />
                    <button onClick={handleAdd}>إضافة</button>
                </div>
            );
        }

        // مكون المهمة الواحدة
        function TaskItem({ task, onDelete }) {
            return (
                <li className="task-item">
                    {task.text}
                    <button className="del-btn" onClick={onDelete}>حذف</button>
                </li>
            );
        }

        // المكون الرئيسي
        function App() {
            const [tasks, setTasks] = React.useState([]);

            const addTask = (text) => setTasks([...tasks, { id: Date.now(), text }]);
            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            return (
                <div className="container">
                    <h1>ParaMaster Pro</h1>
                    <AddTask onAdd={addTask} />
                    <ul style={{ listStyle: 'none', padding: 0 }}>
                        {tasks.map(t => <TaskItem key={t.id} task={t} onDelete={() => deleteTask(t.id)} />)}
                    </ul>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
