<script type="text/babel">
    function App() {
        const [tasks, setTasks] = React.useState([]);
        const [activeTab, setActiveTab] = React.useState('add'); // للتحكم في التبويبة النشطة

        return (
            <div className="wrapper">
                <div className="sidebar">
                    <h2>PARA MASTER</h2>
                    <div className="menu-item" onClick={() => setActiveTab('add')}>➕ إضافة مهمة</div>
                    <div className="menu-item" onClick={() => setActiveTab('list')}>📋 قائمة المهام</div>
                </div>
                <div className="main">
                    <div className="card">
                        {activeTab === 'add' ? (
                            <div>
                                <h3>إضافة مهمة جديدة</h3>
                                <input id="taskInput" placeholder="اكتبي المهمة هنا..." />
                                <button onClick={() => {
                                    const val = document.getElementById('taskInput').value;
                                    setTasks([...tasks, val]);
                                }}>حفظ</button>
                            </div>
                        ) : (
                            <div>
                                <h3>قائمة المهام</h3>
                                <table>
                                    <thead><tr><th>م</th><th>المهمة</th></tr></thead>
                                    <tbody>
                                        {tasks.map((t, i) => <tr key={i}><td>{i+1}</td><td>{t}</td></tr>)}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    }
    // ... باقي كود الريندر (Render)
</script>
