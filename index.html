<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaMaster Pro - Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; direction: rtl; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 160px; background-color: #2c3e50; color: #ecf0f1; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar h2 { font-size: 1.2rem; color: #3498db; margin-bottom: 30px; }
        .menu-item { padding: 12px 0; cursor: pointer; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .menu-item:hover { color: #3498db; }
        .main-content { flex: 1; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; border-top: 5px solid #3498db; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #fdfdfd; padding: 12px; border: 1px solid #eee; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [tasks, setTasks] = React.useState([]);
            const [input, setInput] = React.useState("");

            const addTask = () => {
                if (input.trim()) {
                    setTasks([...tasks, input]);
                    setInput("");
                }
            };

            return (
                <div className="wrapper">
                    <div className="sidebar">
                        <h2>ParaMaster</h2>
                        <div className="menu-item">🏠 الرئيسية</div>
                        <div className="menu-item">📋 المهام</div>
                        <div className="menu-item">⚙️ الإعدادات</div>
                    </div>
                    <div className="main-content">
                        <div className="card">
                            <h3>إضافة مهمة جديدة</h3>
                            <div className="input-group">
                                <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="اكتب هنا..." />
                            </div>
                            <button onClick={addTask}>إضافة للمستودع</button>
                            <ul>
                                {tasks.map((t, i) => <li key={i}>{t}</li>)}
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
